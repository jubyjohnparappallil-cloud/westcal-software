<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Westcal Field — Site Engineers &amp; Trainers</title>
<link rel="manifest" href="/m/manifest.webmanifest" />
<link rel="icon" type="image/jpeg" href="/logo.jpg" />
<meta name="theme-color" content="#0b4f9c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  /* ============================================================
     Westcal Field — mobile-first. Built for one-handed phone use:
     16px base text, 48px minimum tap targets, single column, thumb
     nav at the bottom. No tables anywhere.
     ============================================================ */
  :root{
    --brand:#0b4f9c; --brand-dark:#083a74; --ink:#12203a; --muted:#5d6b82;
    --line:#e2e8f0; --bg:#f5f7fa; --card:#fff;
    --ok:#0f8a4a; --warn:#b4520a; --err:#c62828;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:var(--bg);
    overscroll-behavior-y:contain;
  }
  /* Visible focus for keyboard / switch-access users */
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ---------- App bar ---------- */
  .appbar{
    position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
    padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;
  }
  .appbar h1{font-size:17px;margin:0;flex:1;font-weight:600;line-height:1.3;}
  .appbar .sub{display:block;font-size:12px;opacity:.85;font-weight:400;}
  .iconbtn{
    min-width:44px;min-height:44px;border:0;background:rgba(255,255,255,.16);color:#fff;
    border-radius:12px;font-size:18px;display:flex;align-items:center;justify-content:center;
  }
  .badge{
    position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;border-radius:999px;
    min-width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;
  }
  .badge-wrap{position:relative;}

  /* ---------- Layout ---------- */
  main{padding:16px 16px calc(88px + var(--safe-b));max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;}
  .card h2{font-size:16px;margin:0 0 4px;}
  .muted{color:var(--muted);font-size:14px;}
  .sect{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1d4ed8;margin:20px 0 10px;}
  .row{display:flex;gap:10px;align-items:center;}
  .grow{flex:1;min-width:0;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .big{font-size:40px;display:block;margin-bottom:10px;}
  .job-block{background:#f4f7fb;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px;}
  .job-block h3{margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#1d4ed8;}
  .fact{margin:0 0 14px;}
  .fact:last-child{margin-bottom:0;}
  .fact .fl{margin-top:0;}
  .fact .val{background:#fff;border:1.5px solid #d7dee8;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;color:#0f172a;min-height:50px;}

  /* ---------- Job cards ---------- */
  .job{
    display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-left:5px solid var(--brand);border-radius:14px;padding:14px 16px;margin-bottom:12px;font:inherit;color:inherit;
  }
  .job:active{background:#eef3fa;}
  .job .no{font-weight:700;font-size:15px;}
  .job .cust{margin:3px 0;}
  .job .meta{font-size:13px;color:var(--muted);}
  .chip{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
    background:#eaeff6;color:var(--brand-dark);
  }
  .chip.Assigned{background:#e7f0fd;color:#12509b;}
  .chip.InProgress{background:#fff3e0;color:var(--warn);}
  .chip.Submitted{background:#ede7f6;color:#5330a8;}
  .chip.Pass{background:#e7f6ef;color:#0f8a4a;}
  .chip.Fail{background:#fdeaea;color:#c62828;}
  .chip.Approved{background:#e6f5ec;color:var(--ok);}
  .chip.Rejected,.chip.Cancelled{background:#fdecec;color:var(--err);}

  /* ---------- Detail rows ---------- */
  dl.kv{margin:0;}
  dl.kv div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
  dl.kv div:last-child{border-bottom:0;}
  dl.kv dt{flex:0 0 42%;color:#0f172a;font-size:13px;font-weight:800;margin:0;}
  dl.kv dd{flex:1;margin:0;font-size:16px;font-weight:600;word-break:break-word;color:#0f172a;}

  /* ---------- Forms ---------- */
  label.fl{display:block;font-size:13px;font-weight:800;color:#0f172a;margin:14px 0 7px;}
  input,select,textarea{
    width:100%;font:16px/1.4 inherit;color:var(--ink);background:#fff;
    border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:50px;
  }
  .course-list{display:flex;flex-direction:column;gap:8px;}
  .course-pick{display:flex;align-items:center;gap:10px;margin:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:15px;}
  .course-pick input{width:auto;min-height:22px;flex-shrink:0;}
  textarea{min-height:96px;resize:vertical;}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:52px;padding:14px 18px;border:0;border-radius:12px;
    background:var(--brand);color:#fff;font:600 16px inherit;
  }
  .btn:active{background:var(--brand-dark);}
  .btn[disabled]{opacity:.5;}
  .btn.sec{background:#eaeff6;color:var(--brand-dark);}
  .btn.ok{background:var(--ok);}
  .btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line);}
  .btn+.btn{margin-top:10px;}
  .err{color:var(--err);font-size:14px;margin-top:10px;}
  .okmsg{color:var(--ok);font-size:14px;margin-top:10px;}

  /* ---------- Capture ---------- */
  .capture{
    border:2px dashed #b9c6d8;border-radius:14px;padding:26px 16px;text-align:center;background:#fbfcfe;
  }
  .capture .big{font-size:38px;display:block;margin-bottom:8px;}
  .shots{display:flex;gap:12px;margin-top:12px;align-items:flex-start;}
  .shots figure{margin:0;text-align:center;font-size:11px;color:var(--muted);}
  .shots img{border:1px solid var(--line);border-radius:10px;display:block;background:#fff;}
  .idshot img{width:100%;max-width:230px;}
  .portrait img{width:96px;height:120px;object-fit:cover;}
  .scanning{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--brand-dark);margin-top:12px;}
  .spin{width:18px;height:18px;border:2.5px solid #cfdcec;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;flex:none;}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}

  /* ---------- Signature ---------- */
  .sigwrap{border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;}
  canvas.sig{display:block;width:100%;height:170px;touch-action:none;}
  .sighint{font-size:12px;color:var(--muted);text-align:center;padding:6px;border-top:1px dashed var(--line);}

  /* ---------- Attendees ---------- */
  .att{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
  .att:last-child{border-bottom:0;}
  .att img.face{width:46px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;}
  .att .ph{width:46px;height:56px;border-radius:8px;background:#eaeff6;display:flex;align-items:center;justify-content:center;color:var(--brand-dark);font-weight:700;flex:none;}
  .att .nm{font-weight:600;}
  .att .dt{font-size:13px;color:var(--muted);}
  .att img.sg{width:180px;height:180px;object-fit:contain;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;}
  .checkline{display:flex;align-items:center;gap:10px;font-weight:600;margin:12px 0;}
  .checkline input{width:auto;min-height:22px;}
  .split{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:720px){.split{grid-template-columns:1.3fr .7fr}}
  .sheetwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
  .sheet{width:100%;min-width:560px;border-collapse:collapse}
  .sheet th,.sheet td{border:1px solid var(--line);padding:10px 8px;font-size:13px;vertical-align:middle}
  .sheet th{background:#f4f7fb;font-size:12px;font-weight:800;color:#0f172a}
  .sheet input{width:100%;min-height:44px;margin:4px 0}
  .datesplit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sheet td.sig img{height:28px;max-width:70px}
  canvas.rowsig{width:140px;height:64px;border:1px dashed #8aa0bc;background:#fafafa;touch-action:none;display:block}
  .sheet .empty{height:28px}
  .banner{display:flex;border:2px solid #111;margin-bottom:10px}
  .banner .logo{width:92px;border-right:2px solid #111;display:flex;align-items:center;justify-content:center;padding:6px}
  .banner img{max-height:42px;max-width:80px}
  .banner .co{flex:1;text-align:center;padding:6px 8px}
  .banner h3{margin:0 0 2px;font-size:13px}
  .banner p{margin:0;font-size:11px;line-height:1.35}
  .meta td:nth-child(odd){font-weight:700;background:#fafafa;width:28%}
  .mini{font-size:12px;color:var(--muted)}
  .attacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .attacts .btn{width:auto;min-height:40px;padding:8px 10px;font-size:13px;margin:0}
  .wc-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .wc-ct{font:bold 12px/1.4 Times New Roman,Times,serif;color:#151515}
  .wc-bar{background:#4d83bc;color:#fff;text-align:center;font:700 12px inherit;padding:8px 10px;margin:10px -16px 12px;letter-spacing:.2px}

  /* ---------- Bottom nav ---------- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:#fff;
    border-top:1px solid var(--line);padding-bottom:var(--safe-b);
  }
  nav.tabs button{
    flex:1;min-height:60px;border:0;background:none;color:var(--muted);font:600 11px inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  nav.tabs button .ic{font-size:21px;line-height:1;}
  nav.tabs button[aria-current="page"]{color:var(--brand);}
  .jobtabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px;}
  .jobtabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:11px 6px;border-radius:10px;font:inherit;font-size:13px;font-weight:600;}
  .jobtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;}

  /* ---------- Sign in ---------- */
  .signin{max-width:400px;margin:0 auto;padding:38px 22px calc(30px + var(--safe-b));}
  .signin img{height:56px;display:block;margin:0 auto 18px;}
  .signin h1{font-size:22px;text-align:center;margin:0 0 4px;}
  .signin p.s{text-align:center;color:var(--muted);margin:0 0 26px;font-size:14px;}
  .demo{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.9;text-align:center;}

  .toast{
    position:fixed;left:16px;right:16px;bottom:calc(76px + var(--safe-b));z-index:40;
    background:#12203a;color:#fff;padding:14px 16px;border-radius:12px;font-size:14px;
  }
</style>
</head>
<body>
<div id="root" role="main"></div>
<script>
/* =========================================================================
   Westcal Field — the mobile app for Site Engineers and Trainers.
   Talks to the same REST API as the desktop console. Shows only jobs
   assigned to the signed-in user (the server enforces that too).
   ========================================================================= */
let session=null, jobs=[], noti=[], tab="jobs", current=null, jobSection="details";
let capture={ idCardDataUrl:null, photoDataUrl:null, extraPhotoDataUrl:null, fetched:null, signature:null, editingId:null, trainerSignature:null };
let rowEditId=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WESTCAL_NAME="Westcal Instrumentation and Calibration Services LLC";
function formatDob(v){
  const m=String(v||"").trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?`${m[3]}/${m[2]}/${m[1]}`:(v||"-");
}
function sheetView(j){
  const insigniaName=(j.sheetInsigniaName||"").trim()||WESTCAL_NAME;
  const logoSrc=j.sheetInsigniaLogoDataUrl||"/logo.jpg";
  const jobLabel=(j.sheetJobLabel||"").trim()||"WESTCAL Job";
  const jobNo=(j.sheetJobNo||"").trim()||(String(j.jobOrderNo||j.jobNo||"").replace(/\D/g,"")||(j.jobOrderNo||j.jobNo||""));
  const courseTitle=(j.sheetCourseTitle||"").trim()||j.course||"Training";
  const code=(j.sheetCourseCode||"").trim()||String((j.course||"TRAINING").split(" · ")[0]||"TRAINING").toUpperCase();
  const invoiced=(j.sheetCompany||"").trim()||j.customerName||"";
  const certifiedBy=(j.certificateUnder||"").trim()||invoiced;
  const date=formatDob(j.trainingDate);
  return {insigniaName,logoSrc,jobLabel,jobNo,courseTitle,code,invoiced,certifiedBy,date,time:""};
}

/* ---------------------------------------------------------------------------
   Where the API lives.
   - As a PWA the app is served by the backend, so relative paths just work.
   - Packaged natively (Capacitor) the page origin is the device itself, so it
     needs an absolute server URL. config.js sets WESTCAL_API_BASE at build
     time, and the engineer can override it on the sign-in screen if the
     company later moves the server.
   --------------------------------------------------------------------------- */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function apiBase(){
  const saved=localStorage.getItem("westcal.apiBase");
  const baked=window.WESTCAL_API_BASE||"";
  return (saved||baked||"").replace(/\/+$/,"");
}
function setApiBase(v){
  const clean=(v||"").trim().replace(/\/+$/,"");
  if(clean) localStorage.setItem("westcal.apiBase",clean);
  else localStorage.removeItem("westcal.apiBase");
}

async function api(method,path,body){
  const h={"Content-Type":"application/json"};
  if(session) h.Authorization="Bearer "+session.token;
  let res;
  try{
    res=await fetch(apiBase()+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  }catch(err){
    throw new Error("Cannot reach the server. Check your signal and the server address.");
  }
  const d=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.message||"Request failed");
  return d;
}
function toast(msg){
  const t=document.createElement("div");
  t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200);
}
async function downloadBlob(path,filename){
  const h={};
  if(session) h.Authorization="Bearer "+session.token;
  const res=await fetch(apiBase()+path,{headers:h});
  if(!res.ok){
    const d=await res.json().catch(()=>({}));
    throw new Error(d.message||"Download failed");
  }
  const url=URL.createObjectURL(await res.blob());
  const a=document.createElement("a"); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const isTrainer=()=>session&&session.roles.includes("role-trainer");
const isSiteEngineer=()=>session&&session.roles.includes("role-site-engineer");
const myRole=()=>isTrainer()?"Trainer":(isSiteEngineer()?"Site Engineer":"Field");
const isTrainingJob=j=>!j.serviceType||j.serviceType==="Training";
const statusLabel=s=>({
  "Assigned":"Assigned — ready to start",
  "In Progress":"In progress",
  "Submitted":"Certificate requested",
  "Approved":"Certificate issued",
  "Rejected":"Returned by office",
  "Cancelled":"Cancelled"
}[s]||s);

/* ===================== SIGN IN ===================== */
function renderSignIn(){
  $("root").innerHTML=`
    <div class="signin">
      <img src="/logo.jpg" alt="Westcal" />
      <h1>Westcal Field</h1>
      <p class="s">Trainers mark attendance · Site engineers record tests</p>
      <label class="fl" for="u">Username</label>
      <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" value="engineer1" />
      <label class="fl" for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" value="pw" />
      <button class="btn" style="margin-top:22px" onclick="doSignIn()">Sign in</button>
      <div class="err" id="se" role="alert"></div>
      <button class="btn ghost" style="margin-top:14px" onclick="toggleServer()">Server settings</button>
      <div id="srv" ${NATIVE && !apiBase() ? "" : "hidden"}>
        <label class="fl" for="apibase">Server address</label>
        <input id="apibase" inputmode="url" autocapitalize="none" spellcheck="false"
               placeholder="https://app.caltech-eng.com" value="${esc(apiBase())}" />
        <p class="muted" style="margin:8px 0 0">Leave blank when opening the app from the server itself.</p>
        <button class="btn sec" style="margin-top:10px" onclick="saveServer()">Save address</button>
      </div>
      <p class="demo">Site Engineer — <b>engineer1 / pw</b><br>Trainer — <b>trainer1 / pw</b></p>
    </div>`;
}
async function doSignIn(){
  const e=$("se"); e.textContent="";
  try{
    session=await api("POST","/api/sign-in",{identifier:$("u").value.trim().toLowerCase(),credential:$("p").value.trim()});
    if(!isTrainer()&&!isSiteEngineer()){
      session=null;
      e.textContent="This app is for Site Engineers and Trainers. Please use the desktop console.";
      return;
    }
    tab="dashboard"; await refresh(); render();
  }catch(err){ e.textContent=err.message; }
}
function signOut(){ session=null; jobs=[]; noti=[]; renderSignIn(); }
function toggleServer(){ const s=$("srv"); s.hidden=!s.hidden; if(!s.hidden) $("apibase").focus(); }
function saveServer(){ setApiBase($("apibase").value); toast("Server address saved."); $("srv").hidden=true; }

/* ===================== SHELL ===================== */
async function refresh(){
  jobs=await api("GET","/api/training").catch(()=>[]);
  noti=await api("GET","/api/notifications").catch(()=>[]);
}
function render(){
  const unread=noti.filter(n=>!n.read).length;
  const titles={dashboard:"Dashboard",jobs:"My Jobs",submitted:"Submitted Documents",alerts:"Alerts"};
  $("root").innerHTML=`
    <header class="appbar">
      <h1>${titles[tab]||"Westcal Field"}<span class="sub">${esc(session.displayName)} · ${myRole()}</span></h1>
      <span class="badge-wrap">
        <button class="iconbtn" onclick="go('alerts')" aria-label="Alerts${unread?`, ${unread} unread`:""}">&#128276;</button>
        ${unread?`<span class="badge" aria-hidden="true">${unread}</span>`:""}
      </span>
      <button class="iconbtn" onclick="signOut()" aria-label="Sign out">&#9099;</button>
    </header>
    <main id="body"></main>
    <nav class="tabs" aria-label="Sections">
      <button onclick="go('dashboard')" ${tab==="dashboard"?'aria-current="page"':""}><span class="ic" aria-hidden="true">&#127968;</span>Home</button>
      <button onclick="go('jobs')" ${tab==="jobs"?'aria-current="page"':""}><span class="ic" aria-hidden="true">&#128203;</span>Jobs</button>
      <button onclick="go('submitted')" ${tab==="submitted"?'aria-current="page"':""}><span class="ic" aria-hidden="true">&#128196;</span>Submitted</button>
      <button onclick="go('alerts')" ${tab==="alerts"?'aria-current="page"':""}><span class="ic" aria-hidden="true">&#128276;</span>Alerts</button>
    </nav>`;
  if(tab==="dashboard") renderMobileDashboard();
  else if(tab==="jobs") current?renderJob():renderJobs();
  else if(tab==="submitted") renderSubmitted();
  else renderAlerts();
}
async function go(t){
  tab=t; current=null;
  if(t==="alerts"){ await api("POST","/api/notifications/read",{}).catch(()=>{}); }
  await refresh(); render();
  if(t==="alerts") noti=noti.map(n=>({...n,read:true}));
}

/* ===================== JOB LIST ===================== */
function renderMobileDashboard(){
  const active=jobs.filter(j=>j.status==="Assigned"||j.status==="In Progress");
  const requested=jobs.filter(j=>j.status==="Submitted");
  const issued=jobs.filter(j=>j.status==="Approved");
  $("body").innerHTML=`
    <div class="card">
      <h2>Welcome, ${esc(session.displayName)}</h2>
      <p class="muted">${isTrainer()?"Open an assigned job, complete the review, mark attendance and send the certificate request.":"Open an assigned job, record results and submit it to the office."}</p>
    </div>
    <div class="stats">
      <button class="job" onclick="go('jobs')"><div class="row"><span class="grow"><b>Active jobs</b></span><span class="chip">${active.length}</span></div><div class="meta">Assigned or in progress</div></button>
      <button class="job" onclick="go('submitted')"><div class="row"><span class="grow"><b>Certificate requested</b></span><span class="chip Submitted">${requested.length}</span></div><div class="meta">Waiting for Office Admin</div></button>
      <button class="job" onclick="go('submitted')"><div class="row"><span class="grow"><b>Certificates issued</b></span><span class="chip Approved">${issued.length}</span></div><div class="meta">Completed documents</div></button>
    </div>
    <div class="sect">What to do next</div>
    ${active.length?active.map(j=>`<button class="job" onclick="openJob('${j.id}')">
      <div class="row"><span class="no grow">${esc(j.jobNo)}</span><span class="chip ${j.status.replace(" ","")}">${esc(statusLabel(j.status))}</span></div>
      <div class="cust">${esc(j.customerName)}</div><div class="meta">${esc(j.course)}</div>

async function openJob(id){
  tab="jobs";
  const list=await api("GET","/api/training");
  current=list.find(x=>x.id===id);
  if(!current){ toast("That job is no longer assigned to you."); jobs=list; render(); return; }
  jobSection="details";
  capture={ idCardDataUrl:null, photoDataUrl:null, extraPhotoDataUrl:null, fetched:null, signature:null, editingId:null, trainerSignature:null };
  rowEditId=null;

}
function backToList(){ current=null; render(); }
async function showJobSection(section){

}

async function saveReview(){
  const e=$("rve"); e.textContent="";
  const prepared=$("rv_prepared").value.trim(), method=$("rv_method").value.trim(), type=($("rv_type")&&$("rv_type").value.trim())||"Safety Training";
  if(!prepared||!method){ e.textContent="Prepared by and training method are required."; return; }
  const prior=current.contractReview||{};
  try{
    await api("POST",`/api/training/${current.id}/review`,{
      jobNo:current.jobNo,customerName:current.customerName,scopeOfWork:current.course,
      crPreparedBy:prepared,contactPersonNumber:$("rv_contact").value,
      trainerName:current.assigneeName||current.trainerName||session.displayName,
      standardReference:$("rv_standard").value,trainingMethodUsed:method,typeOfTraining:type,
      customerFeedback:prior.customerFeedback||"",customerFeedbackNotes:prior.customerFeedbackNotes||"",
      attached:prior.attached||emptyDocumentChecklist(),
      checkedByMRTM:prior.checkedByMRTM||"",finalCheckedByBM:prior.finalCheckedByBM||""
    });
    toast("Review form saved."); await openJobSection("details");
  }catch(err){ e.textContent=err.message; }
}

function emptyDocumentChecklist(){
  return {workPermit:false,trainingReports:false,do_:false,trainingRequestForm:false,
    trainingCertificates:false,invoice:false,quotation:false,finalCertificatesCopy:false,
    scanned:false,lpo:false};
}

function completeReview(overrides){
  const r=current.contractReview||{};
  return {
    jobNo:current.jobNo,customerName:current.customerName,scopeOfWork:current.course,
    crPreparedBy:r.crPreparedBy||session.displayName,
    contactPersonNumber:r.contactPersonNumber||current.contactNameNumber||"",
    trainerName:current.assigneeName||current.trainerName||session.displayName,
    standardReference:r.standardReference||current.standardReference||"",
    trainingMethodUsed:r.trainingMethodUsed||current.mode||"Onsite",
    typeOfTraining:r.typeOfTraining||current.typeOfTraining||"Safety Training",
    customerFeedback:r.customerFeedback||"",customerFeedbackNotes:r.customerFeedbackNotes||"",
    attached:r.attached||emptyDocumentChecklist(),
    checkedByMRTM:r.checkedByMRTM||"",finalCheckedByBM:r.finalCheckedByBM||"",
    ...overrides
  };
}

async function saveFeedback(){
  const e=$("fbe"); e.textContent="";
  try{
    await api("POST",`/api/training/${current.id}/review`,completeReview({
      customerFeedback:$("fb_result").value,
      customerFeedbackNotes:$("fb_notes").value
    }));
    toast("Customer feedback saved."); await openJobSection("feedback");
  }catch(err){ e.textContent=err.message; }
}

async function saveDocumentChecklist(){
  const e=$("doce"); e.textContent="";
  const attached={};
  Object.keys(emptyDocumentChecklist()).forEach(k=>attached[k]=!!$("doc_"+k)?.checked);
  try{
    await api("POST",`/api/training/${current.id}/review`,completeReview({attached}));
    toast("Supporting document checklist saved."); await openJobSection("attachments");
  }catch(err){ e.textContent=err.message; }
}

/** Downscale on the phone so we are not posting multi-megabyte photos over 4G. */
function shrinkImage(file,maxW){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg",0.82));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src=url;
  });
}

/**
 * Pull the portrait off the card. The photo sits in a consistent place on an
 * Emirates ID, so a fixed crop gets it. A production ID service would return
 * proper face coordinates; the engineer can always retake the shot.
 */
function cropPortrait(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      const sx=img.width*0.045, sy=img.height*0.30, sw=img.width*0.255, sh=img.height*0.60;
      cv.width=240; cv.height=300;
      cv.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
      resolve(cv.toDataURL("image/jpeg",0.85));
    };
    img.onerror=()=>resolve(null);
    img.src=dataUrl;
  });
}

function binarizeCanvas(cv){
  const ctx=cv.getContext("2d");
  const img=ctx.getImageData(0,0,cv.width,cv.height);
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=g<150?0:255;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,0,0);
}

/** Lower / second strip + back MRZ — that is where the 784 ID number is printed. */
function cropIdNumberZones(dataUrl){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const zones=[
        {x:0.02,y:0.55,w:0.96,h:0.42},
        {x:0.30,y:0.20,w:0.68,h:0.78},
        {x:0.02,y:0.72,w:0.96,h:0.26},
        {x:0.02,y:0.02,w:0.96,h:0.96}
      ];
      const urls=zones.map(z=>{
        const sx=img.width*z.x, sy=img.height*z.y, sw=img.width*z.w, sh=img.height*z.h;
        const cv=document.createElement("canvas");
        cv.width=Math.max(900,Math.round(sw*2));
        cv.height=Math.max(220,Math.round(sh*2));
        const ctx=cv.getContext("2d");
        ctx.imageSmoothingEnabled=true;
        ctx.drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
        binarizeCanvas(cv);
        return cv.toDataURL("image/jpeg",0.95);
      });
      resolve(urls);
    };
    img.onerror=()=>resolve([]);
    img.src=dataUrl;
  });
}

async function recognizeText(T,image,opts){
  try{
    const out=await T.recognize(image,"eng",opts||{});
    return (out&&out.data&&out.data.text)||"";
  }catch{ return ""; }
}

async function ocrEmiratesCard(T,images){
  const chunks=[];
  const digitOpts={ tessedit_char_whitelist:"0123456789- " };
  for(const url of images){
    chunks.push(await recognizeText(T,url));
    chunks.push(await recognizeText(T,url,digitOpts));
    const crops=await cropIdNumberZones(url);
    for(const crop of crops){
      chunks.push(await recognizeText(T,crop));
      chunks.push(await recognizeText(T,crop,digitOpts));
    }
  }
  return chunks.filter(Boolean).join("\n");
}

/**
 * Read the card. OCR runs in the browser via tesseract.js; the extracted text
 * goes to the server parser that already knows the Emirates ID layout, so the
 * field rules live in one place. If OCR is unavailable (no signal, blocked CDN)
 * we fall back to manual entry rather than blocking the engineer on site.
 */
async function runScan(){
  const box=$("scanBox");
  box.innerHTML=`<div class="scanning"><span class="spin" aria-hidden="true"></span><span role="status">Reading the card…</span></div>`;
  let text="";
  try{
    const T=await loadTesseract();
    text=await ocrEmiratesCard(T,[capture.idCardDataUrl,capture.extraPhotoDataUrl].filter(Boolean));
  }catch(err){ text=""; }

  if(!text.trim()){
    box.innerHTML=`<p class="muted" style="margin:12px 0 0">Could not read the card automatically. Type the details below, or paste the card text. Photograph the lower ID-number strip or the back of the card.</p>`;
    capture.fetched={name:"",idOrVisaNo:"",nationality:"",mobileNumber:"",dateOfBirth:"",confidence:0};
    renderFields(true);
    return;
  }
  try{
    capture.fetched=await api("POST",`/api/training/${current.id}/id-fetch`,{ocrText:text});
  }catch(err){
    capture.fetched={name:"",idOrVisaNo:"",nationality:"",mobileNumber:"",dateOfBirth:"",confidence:0};
  }
  if(!capture.fetched.idOrVisaNo){
    capture.fetched.idOrVisaNo=formatEidLocal(text);
  }
  if(!capture.fetched.idOrVisaNo){
    const typed=(prompt("ID number was not read from the card. Type the Emirates ID (784-....)")||"").trim();
    if(typed) capture.fetched.idOrVisaNo=formatEidLocal(typed)||typed;
  }
  const pc=Math.round((capture.fetched.confidence||0)*100);
  const missingId=!capture.fetched.idOrVisaNo;
  box.innerHTML=`<p class="okmsg" role="status">Read ${pc}% of the fields. Check them before saving.</p>${missingId?`<p class="muted">ID number was not in the first photo. Use <b>Upload ID back (number strip)</b> — the 784 number sits in the lower band and on the reverse.</p>`:""}`;
  renderFields(missingId);
}

let tesseractPromise=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractPromise) return tesseractPromise;
  tesseractPromise=new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error("no ocr"));
    s.onerror=()=>reject(new Error("ocr unavailable"));
    setTimeout(()=>reject(new Error("ocr timeout")),20000);
    document.head.appendChild(s);
  });
  return tesseractPromise;
}

/* ---- signature pad ---- */
function bindPad(cv, onDone){
  const dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect();
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext("2d");
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#12203a";
  let drawing=false, dirty=false;
  const pt=e=>{ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  cv.onpointerdown=e=>{ drawing=true; dirty=true; cv.setPointerCapture(e.pointerId); const p=pt(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  cv.onpointermove=e=>{ if(!drawing)return; const p=pt(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  cv.onpointerup=()=>{ drawing=false; if(dirty) onDone(cv.toDataURL("image/png")); };
  cv.onpointercancel=()=>{ drawing=false; };
  return ctx;
}
function initSig(){
  const cv=$("sig"); if(!cv) return;
  const ctx=bindPad(cv, data=>{ capture.signature=data; });
  if(capture.signature){
    const img=new Image(); const r=cv.getBoundingClientRect();
    img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=capture.signature;
  }
}
function clearSig(){
  const cv=$("sig"); if(!cv) return;
  cv.getContext("2d").clearRect(0,0,cv.width,cv.height);
  capture.signature=null;
}

async function saveAttendee(){
  const e=$("ae"); e.textContent="";
  const mob=($("a_mob").value||"").replace(/[\s-+]/g,"");
  if(!$("a_name").value.trim()){ e.textContent="Name is required."; return; }
  if(!/^\d{7,20}$/.test(mob)){ e.textContent="Mobile number must be 7 to 20 digits."; return; }
  const ticked=[...document.querySelectorAll("input[name=list_course]:checked")].map(el=>el.value).filter(Boolean);
  const one=$("a_course")?$("a_course").value:"";
  const courses=ticked.length?ticked:(one?[one]:[]);
  if(!courses.length){ e.textContent="Tick at least one training course."; return; }
  const trainingDate=($("a_train_date")&&$("a_train_date").value||"").trim();
  const certifiedBy=($("a_certified")&&$("a_certified").value||"").trim();
  if(!trainingDate){ e.textContent="Training date is required. It prints on the attendance sheet."; return; }
  if(!certifiedBy){ e.textContent="Certified to is required. It prints on the attendance sheet."; return; }
  const payload={
    name:$("a_name").value, company:$("a_company").value,
    idOrVisaNo:($("a_id").value||"").trim(), nationality:$("a_nat").value,
    mobileNumber:mob, dateOfBirth:$("a_dob").value||undefined,
    idCardDataUrl:capture.idCardDataUrl||undefined,
    photoDataUrl:capture.photoDataUrl||undefined,
    extraPhotoDataUrl:capture.extraPhotoDataUrl||undefined,
    signature:capture.signature||undefined,
    autoFetched:!!(capture.fetched&&capture.fetched.confidence>0),
    course:courses[0],
    courses
  };
  try{
    if(current.status!=="Approved" && current.status!=="Cancelled"){
      await api("POST",`/api/training/${current.id}/attendance-meta`,{trainingDate,trainingDateTo:trainingDate,certifiedBy});
    }
    if(capture.editingId){
      const patch={...payload};
      delete patch.courses;
      await api("PATCH",`/api/training/${current.id}/attendees/${capture.editingId}`,patch);
      toast("Trainee updated.");
    }else{
      await api("POST",`/api/training/${current.id}/attendees`,{
        ...payload,
        idCardFileName:capture.idCardDataUrl?"emirates-id.jpg":undefined
      });
      toast("Trainee added.");
    }
    resetCapture();
    await openJobSection("attendance");
  }catch(err){ e.textContent=err.message; }
}

function formatEidLocal(text){
  const t=String(text||"").replace(/[OoDd]/g,"0").replace(/[Il|]/g,"1").replace(/[Ss]/g,"5").replace(/[Zz]/g,"2").replace(/B/g,"8");
  const spaced=t.match(/784[\s\-–—.]{0,3}\d{4}[\s\-–—.]{0,3}\d{7}[\s\-–—.]{0,3}\d/);
  let d=(spaced?spaced[0]:"").replace(/\D/g,"");
  if(!/^784\d{12}$/.test(d)){
    const all=t.replace(/\D/g,"");
    const i=all.indexOf("784");
    if(i>=0) d=all.slice(i,i+15);
  }
  if(!/^784\d{12}$/.test(d)) return "";
  return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7,14)+"-"+d.slice(14);
}

function startEditAttendee(id){
  rowEditId=rowEditId===id?null:id;
  jobSection="attendance";

async function saveRowEdit(id){
  const e=$("ree_"+id); if(e) e.textContent="";
  const name=($("re_name_"+id).value||"").trim();
  const idOrVisaNo=($("re_eid_"+id).value||"").trim();
  const mobileNumber=($("re_phone_"+id).value||"").replace(/[\s-+]/g,"");
  const company=($("re_co_"+id).value||"").trim();
  if(!name){ if(e) e.textContent="Name is required."; return; }
  if(!/^\d{7,20}$/.test(mobileNumber)){ if(e) e.textContent="Phone must be 7 to 20 digits."; return; }
  try{
    await api("PATCH",`/api/training/${current.id}/attendees/${id}`,{name,idOrVisaNo,mobileNumber,company});
    const a=(current.attendees||[]).find(x=>x.id===id);
    if(a){ a.name=name; a.idOrVisaNo=idOrVisaNo; a.mobileNumber=mobileNumber; a.company=company; }
    rowEditId=null;
    toast("Trainee updated.");
    renderJob();
  }catch(err){ if(e) e.textContent=err.message; else toast(err.message); }
}
async function replaceAttendeePhoto(id,ev){

  try{

    await api("PATCH",`/api/training/${current.id}/attendees/${id}`,{extraPhotoDataUrl,photoDataUrl:extraPhotoDataUrl});
    toast("New photo saved. Send back to admin after you verify.");
    await openJobSection("attendance");
  }catch(err){ toast(err.message); }
}
async function replaceAttendeeId(id,ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  toast("Reading Emirates ID…");
  try{
    const idCardDataUrl=await shrinkImage(file,1800);
    const photoDataUrl=await cropPortrait(idCardDataUrl);
    let text="";
    let fetched={};
    try{
      const T=await loadTesseract();
      text=await ocrEmiratesCard(T,[idCardDataUrl]);
      if(text.trim()) fetched=await api("POST",`/api/training/${current.id}/id-fetch`,{ocrText:text});
    }catch(err){ toast("Could not auto-read the number. Type it below."); }
    let eid=(fetched.idOrVisaNo||formatEidLocal(text)||"").trim();
    await api("PATCH",`/api/training/${current.id}/attendees/${id}`,{
      idCardDataUrl, photoDataUrl,
      name:fetched.name||undefined,
      idOrVisaNo:eid||undefined,
      nationality:fetched.nationality||undefined,
      dateOfBirth:fetched.dateOfBirth||undefined,
      autoFetched:!!eid
    });
    toast(eid?"EID saved: "+eid:"Card photo saved. Type the Emirates ID number (784-…) and tap Save update.");
    rowEditId=id;
    await openJobSection("attendance");
    rowEditId=id;
    renderJob();
    const eidBox=$("re_eid_"+id);
    if(eidBox){ if(eid) eidBox.value=eid; eidBox.focus(); eidBox.scrollIntoView({behavior:"smooth",block:"center"}); }
  }catch(err){ toast(err.message); }
}

async function addTraineeToList(){
  const e=$("tce"); if(e) e.textContent="";

  const mob=($("list_phone").value||"").replace(/[\s-+]/g,"");

  try{
    await api("POST",`/api/training/${current.id}/attendees`,{
      name, company, mobileNumber:mob,
      nationality:"", idOrVisaNo:"", courses, course:courses[0], autoFetched:false
    });
    toast(courses.length>1
      ? "Added "+courses.length+" attendance rows (one per course). Send each row's link, or the same person can complete each."
      : "Added to the list. Copy their link and send it.");
    await openJobSection("attendance");
  }catch(err){ if(e) e.textContent=err.message; }
}
