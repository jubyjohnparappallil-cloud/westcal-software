<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Westcal — Training & Certification</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg" />
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#eceef1;
    --brand:#2563eb; --brand-dark:#1e40af; --ok:#059669; --warn:#dc2626; --amber:#d97706;
    --sidebar:#0f172a; --sidebar-ink:#cbd5e1; --sidebar-active:#1e293b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  a{color:var(--brand);text-decoration:none;}

  /* ---- Sign in ---- */
  .signin-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef2ff,#f8fafc);}
  .signin{background:#fff;border-radius:16px;box-shadow:0 10px 40px #0000001a;padding:34px;width:min(380px,calc(100% - 32px));}
  .signin .logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin-bottom:14px;}
  .signin h1{font-size:19px;margin:0 0 2px;} .signin p.sub{color:var(--muted);margin:0 0 20px;font-size:13px;}

  /* ---- App shell ---- */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:240px;background:var(--sidebar);color:var(--sidebar-ink);display:flex;flex-direction:column;flex-shrink:0;}
  .sidebar .brand{padding:20px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1e293b;}
  .sidebar .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}
  .sidebar .brand b{color:#fff;font-size:14px;line-height:1.2;}
  .sidebar nav{padding:12px 10px;flex:1;}
  .sidebar nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--sidebar-ink);cursor:pointer;font-size:14px;margin-bottom:3px;}
  .sidebar nav a:hover{background:#1e293b;color:#fff;}
  .sidebar nav a.active{background:var(--brand);color:#fff;}
  .sidebar nav a .ic{width:18px;text-align:center;}
  .sidebar .foot{padding:14px;border-top:1px solid #1e293b;font-size:12px;color:#94a3b8;}

  .content{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .topbar .left{display:flex;align-items:center;gap:10px;min-width:0;}
  .menu-btn{display:none;border:0;background:#eef2f7;color:var(--ink);border-radius:9px;width:42px;height:42px;font-size:20px;cursor:pointer;flex-shrink:0;}
  .topbar h2{margin:0;font-size:17px;}
  .topbar .right{display:flex;align-items:center;gap:14px;}
  .bell{position:relative;cursor:pointer;font-size:18px;}
  .bell .dot{position:absolute;top:-6px;right:-8px;background:var(--warn);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .who{font-size:13px;} .who b{display:block;} .who span{color:var(--muted);font-size:12px;}
  .page{padding:24px;max-width:1180px;width:100%;margin:0 auto;}

  /* ---- Components ---- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;}
  .card h3{margin:0 0 4px;font-size:15px;} .card .hint{color:var(--muted);font-size:13px;margin:0 0 16px;}
  .sect{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;border-top:1px solid var(--line);padding-top:16px;font-weight:600;}
  label{display:block;font-size:13px;color:#111827;margin:0 0 8px;font-weight:700;}
  input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #d5dae1;border-radius:12px;font-size:15px;font-family:inherit;background:#fff;min-height:46px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px #2563eb22;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .job-form{padding:28px 30px;}
  .job-form h3{font-size:22px;font-weight:800;margin:0 0 6px;}
  .job-form > .hint{font-size:14px;margin:0 0 22px;}
  .job-block{background:#f8fafc;border:1px solid #e5eaf0;border-radius:16px;padding:18px 18px 16px;margin:0 0 16px;}
  .job-block h4{margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1d4ed8;}
  .job-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;}
  .span-2{grid-column:span 2;}
  .span-3{grid-column:span 3;}
  .span-4{grid-column:1 / -1;}
  .job-form input[readonly]{background:#eef2f7;color:#1e293b;font-weight:700;}
  .add-row{display:flex;gap:10px;align-items:stretch;}
  .add-row input{flex:1;}
  .add-row .btn{width:auto;white-space:nowrap;min-height:46px;}
  .job-form .btn.wide{width:100%;min-height:52px;font-size:16px;margin-top:8px;}
  @media(max-width:980px){ .job-row{grid-template-columns:repeat(2,minmax(0,1fr));} .span-3{grid-column:span 2;} }
  @media(max-width:640px){ .job-row{grid-template-columns:1fr;} .span-2,.span-3,.span-4{grid-column:1 / -1;} }
  .btn{background:var(--brand);color:#fff;border:0;padding:10px 18px;border-radius:9px;font-size:14px;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--brand-dark);}
  .btn.sec{background:#eef2f7;color:var(--brand);} .btn.sec:hover{background:#e2e8f2;}
  .btn.dark{background:#0f172a;color:#fff;} .btn.dark:hover{background:#1e293b;}
  .btn.ok{background:var(--ok);} .btn.warn{background:var(--warn);} .btn.sm{padding:6px 12px;font-size:13px;}
  .btn.ghost{background:transparent;color:var(--warn);border:1px solid #f0c9c9;}
  table{width:100%;border-collapse:collapse;}
  .west-cert table{width:auto;border:0;border-collapse:collapse;}
  .west-cert td,.west-cert th{border:0;padding:0;}
  th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:0;}
  .chip{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;background:#eef2f7;color:var(--brand);}
  .chip.Approved{background:#e7f6ef;color:var(--ok);} .chip.Submitted{background:#fdf3e2;color:var(--amber);}
  .chip.Rejected,.chip.Cancelled{background:#fdeaea;color:var(--warn);} .chip.Pass{background:#e7f6ef;color:var(--ok);} .chip.Fail{background:#fdeaea;color:var(--warn);}
  .muted{color:var(--muted);} .err{color:var(--warn);font-size:13px;margin-top:8px;} .ok-msg{color:var(--ok);font-size:13px;margin-top:8px;}
  .hidden{display:none;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .stat .n{font-size:28px;font-weight:800;} .stat .l{color:var(--muted);font-size:13px;margin-top:2px;}
  .stat.a{border-left:4px solid var(--brand);} .stat.b{border-left:4px solid var(--amber);} .stat.c{border-left:4px solid var(--ok);}
  .svc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:20px;}
  .svc-btn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;cursor:pointer;font:inherit;color:inherit;}
  .svc-btn:hover{border-color:var(--brand);box-shadow:0 8px 24px #2563eb18;}
  .svc-btn .ico{font-size:28px;display:block;margin-bottom:10px;}
  .svc-btn b{display:block;font-size:18px;margin-bottom:4px;}
  .svc-btn span{color:var(--muted);font-size:13px;}
  .svc-btn .n{float:right;background:#eef2ff;color:var(--brand);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700;}
  @media(max-width:640px){ .svc-grid{grid-template-columns:1fr;} }
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
  .subtabs button{background:#eef2f7;color:var(--ink);border:0;padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px;}
  .subtabs button.on{background:var(--brand);color:#fff;}
  .job-pack{padding:0;overflow:hidden}
  .job-pack-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;cursor:pointer}
  .job-pack-h:hover{background:#f8fafc}
  .job-pack-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .job-pack-b{padding:0 20px 20px;border-top:1px solid var(--line)}
  .dl-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .qr-mini{width:220px;text-align:center;font-size:11px;color:var(--muted)}
  .qr-mini img{width:200px;height:200px;background:#fff;border:1px solid var(--line);border-radius:8px;display:block;margin:0 auto 4px;image-rendering:pixelated}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 18px}
  .kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi span{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .kpi b{display:block;font-size:22px;margin-top:6px;color:var(--ink)}
  .cert-pick{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
  .cert-pick label{display:flex;flex-direction:column;width:140px;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;font-weight:600;font-size:12px}
  .cert-pick label.on{border-color:var(--brand);background:#eff6ff}
  .cert-pick img{width:100%;height:90px;object-fit:cover;border-radius:8px;margin-bottom:6px;background:#fff}
  .quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
  .quick{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:inherit;}
  .quick:hover{border-color:var(--brand);background:#f8fbff;}
  .quick b{display:block;margin-bottom:4px;font-size:14px;}
  .quick span{color:var(--muted);font-size:12px;}
  .flow{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:8px;overflow-x:auto;}
  .flow div{min-width:130px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;}
  .flow b{display:block;color:var(--brand);margin-bottom:5px;}
  .flow span{font-size:12px;color:var(--muted);}
  .perm-tbl td,.perm-tbl th{text-align:center;} .perm-tbl td:first-child,.perm-tbl th:first-child{text-align:left;}
  .cert{border:2px solid var(--brand);border-radius:14px;padding:18px;margin-top:14px;background:#fbfcff;}
  .cert h4{margin:0 0 8px;color:var(--brand-dark);}
  .codes{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;} .codes img{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px;}
  .west-cert{position:relative;width:min(720px,100%);margin:16px auto;aspect-ratio:210/297;background:#fff url(/certificate-achievement-blank.png?v=20260928d) center/100% 100% no-repeat;border:0;box-shadow:none;padding:0;overflow:hidden;text-align:center;font-family:"Times New Roman",Times,serif;color:#16325c;container-type:inline-size;}
  .west-cert.design-letterhead{background:#fff;}
  .west-cert.design-navy-gold{background:#fff;box-shadow:inset 0 0 0 14px #17305f, inset 0 0 0 20px #c9a227;}
  .west-cert .cert-photo{position:absolute;right:13%;top:54.2%;width:12%;aspect-ratio:1;height:auto;overflow:hidden;border:2px solid #c9a227;background:#eee;z-index:2;}
  .west-cert .cert-photo img{position:absolute;top:0;left:-12.5%;width:125%;height:182%;object-fit:cover;object-position:center top;display:block;}
  .west-cert .cert-marks{position:absolute;left:38%;top:79.6%;width:19%;height:auto;z-index:2;pointer-events:none;}
  .west-cert .cert-name{position:absolute;left:8%;right:28%;top:54.6%;text-align:center;font-weight:700;font-size:15px;font-size:2.15cqi;letter-spacing:0;text-transform:uppercase;white-space:nowrap;line-height:1;color:#16325c;}
  .west-cert .cert-rule{position:absolute;left:32%;width:18%;top:57.4%;border:0;border-top:1px solid #222;margin:0;}
  .west-cert .lead{position:absolute;left:10%;right:28%;top:58.4%;text-align:center;font-style:italic;font-weight:700;font-size:11px;font-size:1.45cqi;color:#16325c;white-space:nowrap;}
  .west-cert .cert-course{position:absolute;left:8%;right:28%;top:62.2%;text-align:center;font-weight:700;font-size:14px;font-size:2cqi;text-transform:uppercase;color:#16325c;white-space:nowrap;}
  .west-cert .meta-col{position:absolute;top:68.2%;font-weight:700;font-size:11px;font-size:1.45cqi;color:#16325c;text-align:left;line-height:1.85;}
  .west-cert .meta-left{left:14%;}
  .west-cert .meta-right{left:54%;}
  .west-cert .meta-col span{display:inline-block;min-width:13.5cqi;}
  .west-cert .auth{position:absolute;left:15%;top:77%;width:30%;text-align:left;font-weight:700;font-style:italic;letter-spacing:.8px;font-size:12px;font-size:1.6cqi;}
  .west-cert .contact{position:absolute;left:9%;top:85.6%;width:28%;text-align:left;font-weight:700;font-size:10px;font-size:1.12cqi;line-height:1.15;color:#16325c;}
  .west-cert .qr{position:absolute;right:32%;top:76.4%;width:10%;background:#fff;padding:2px;box-sizing:border-box;z-index:2;}
  .west-cert .qr img{width:100%;height:auto;display:block;background:#fff;}
  .cert-downloads{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:8px auto 22px;max-width:720px;}
  .table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @media(max-width:700px){.west-cert{width:100%}}
  .pill{font-family:monospace;background:#eef2f7;padding:2px 7px;border-radius:5px;font-size:12px;}
  .noti{position:absolute;top:52px;right:20px;width:330px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #00000022;padding:8px;z-index:60;}
  .noti .h{padding:8px 10px;font-weight:700;border-bottom:1px solid var(--line);}
  .noti .item{padding:10px;font-size:13px;border-bottom:1px solid var(--line);} .noti .item:last-child{border-bottom:0;}
  .checkline{display:inline-flex;align-items:center;gap:7px;width:auto;font-weight:500;color:var(--ink);} .checkline input{width:auto;}
  .course-box{border:1px solid #d5dae1;border-radius:12px;max-height:260px;overflow:auto;background:#fff;padding:8px 10px;margin-top:8px;}
  .course-box label{display:flex;align-items:flex-start;gap:8px;margin:0;padding:8px 6px;font-weight:700;color:var(--ink);font-size:14px;border-radius:7px;}
  .course-box label:hover{background:#f4f7fb;}
  .course-box input{width:auto;margin-top:2px;flex-shrink:0;}
  .course-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:8px;}
  .course-picks .chip{background:#eef2ff;}
  @media(max-width:820px){
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;}
    .app{display:block;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);z-index:90;transform:translateX(-105%);transition:transform .2s ease;box-shadow:none;}
    .app.nav-open .sidebar{transform:translateX(0);box-shadow:8px 0 30px #0006;}
    .nav-shade{display:none;position:fixed;inset:0;background:#0f172a88;z-index:85;}
    .app.nav-open .nav-shade{display:block;}
    .topbar{padding:10px 12px;flex-wrap:wrap;}
    .topbar h2{font-size:16px;}
    .topbar .who{display:none;}
    .page{padding:14px 12px;}
    .card,.job-form{padding:16px;}
    .noti{left:8px;right:8px;width:auto;}
    .modal-back{padding:8px;}
    .add-row,.job-pack-h,.wqf-head,.wqf-foot,.dl-row{flex-wrap:wrap;}
    .table-wrap table{min-width:680px;}
    .page .west-cert table{min-width:0;}
    input,select,textarea{font-size:16px;}
  }
  .wqf{background:#fff;border:2px solid #1e3a6e;max-width:960px;margin:0 auto 20px;box-shadow:0 8px 24px #1e3a6e14;}
  .wqf-head{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:3px solid #c9a227;background:#f4f7fb;}
  .wqf-head img{height:54px;}
  .wqf-head .titles{flex:1;}
  .wqf-head h2{margin:0;color:#1e3a6e;font-size:14px;letter-spacing:.03em;text-transform:uppercase;}
  .wqf-head .doc{margin:4px 0 0;color:#1e3a6e;font-weight:800;font-size:17px;}
  .wqf-head .code{font-size:12px;color:#334;font-weight:700;white-space:nowrap;}
  .wqf table.gridf{width:100%;border-collapse:collapse;}
  .wqf table.gridf td{border:1px solid #1e3a6e;padding:7px 9px;vertical-align:top;}
  .wqf table.gridf .lbl{width:18%;background:#e8eef8;font-size:11px;font-weight:700;color:#1e3a6e;text-transform:uppercase;letter-spacing:.03em;}
  .wqf table.gridf input,.wqf table.gridf select,.wqf table.gridf textarea{border:0 !important;padding:4px 0 !important;background:transparent !important;width:100%;border-radius:0 !important;box-shadow:none !important;}
  .wqf-foot{padding:10px 16px;border-top:1px solid #1e3a6e;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#1e3a6e;}
  .wqf .actions{padding:14px 16px;background:#f8fafc;border-top:1px solid #dbe3ef;}
  .modal-back{position:fixed;inset:0;background:#0f172acc;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto;}
  .modal{background:#fff;border-radius:18px;width:min(880px,100%);box-shadow:0 24px 70px #0005;margin:0 auto 40px;}
  .modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 24px 8px;}
  .modal-h h3{margin:0;font-size:20px;}
  .modal-h p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  .steps{display:flex;gap:8px;flex-wrap:wrap;padding:4px 24px 0;}
  .steps span{font-size:12px;font-weight:700;color:#334155;background:#f1f5f9;padding:6px 11px;border-radius:999px;}
  .modal .job-form{padding:8px 24px 24px;margin:0;border:0;}
  .role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:4px 0 16px;}
  .role-card{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;background:#fff;font:inherit;color:inherit;width:100%;}
  .role-card:hover{border-color:#93c5fd;}
  .role-card.on{border-color:var(--brand);background:#eff6ff;}
  .role-card b{display:block;margin-bottom:4px;font-size:14px;}
  .role-card span{font-size:12px;color:var(--muted);line-height:1.35;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px;}
</style>
</head>
<body>
<div id="root">
  <div class="signin-page"><div class="signin">
    <h1>Westcal Platform</h1>
    <p class="sub">Loading… if this stays, open Chrome and go to http://127.0.0.1:3000</p>
  </div></div>
</div>

<script>
let session=null, courses=[], view="dashboard", jobService="Training", trainingTab="jobs", _liSeq=0;
let jobFilterDate="", jobFilterTime="";
let reportPeriod="monthly", reportRefDate="";
let certTab="pending";
let certOpenJob="";
let certSearch="";
let certInner="docs";
let certEditRow="";
let reportStatus="all";
let jobCompanies=[];
let certifiedByManual=false;
let jobEditId="";
const SERVICES=[
  {id:"Testing", icon:"🔬", hint:"Create a testing job, assign the engineer, collect results."},
  {id:"Calibration", icon:"⚖️", hint:"Create a calibration job for instruments on site or in the lab."},
  {id:"Inspection", icon:"🔎", hint:"Create an inspection job and issue the report / certificate."},
  {id:"Training", icon:"🎓", hint:"Create a training job, assign a trainer, issue trainee certificates."},
  {id:"Mapping", icon:"🗺️", hint:"Create a mapping job. Choose the type, then prepare the protocol."},
];
const MAPPING_TYPES=[
  {id:"Cold Room", range:"2 to 8°C"},
  {id:"Warehouse", range:"15 to 25°C"},
  {id:"Vehicle mapping", ranges:["2 to 8°C","15 to 25°C","-15°C to -25°C"]},
  {id:"Freezer mapping", range:"-15°C to -25°C"},
];
const SEASON_OPTIONS=["Summer mapping","Winter mapping","Initial mapping","General"];

async function api(method,path,body){
  const h={"Content-Type":"application/json"};
  if(session?.token) h["Authorization"]="Bearer "+session.token;
  const res=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const d=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.message||"Request failed");
  return d;
}
const has=p=>session&&(session.perms||[]).includes(p);
async function refreshPerms(){
  if(!session?.token) return;
  try{
    const me=await api("GET","/api/me");
    session.perms=me.perms||[];
    session.roles=me.roles||session.roles;
  }catch(_){}
}

function formatDob(v){
  const m=String(v||"").trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?`${m[3]}/${m[2]}/${m[1]}`:(v||"-");
}

  const jobNo=(j.sheetJobNo||"").trim()||(String(j.jobOrderNo||j.jobNo||"").replace(/\D/g,"")||(j.jobOrderNo||j.jobNo||""));
  const courseTitle=(j.sheetCourseTitle||"").trim()||j.course||"Training";
  const code=(j.sheetCourseCode||"").trim()||String((j.course||"TRAINING").split(" · ")[0]||"TRAINING").toUpperCase();
  const invoiced=(j.sheetCompany||"").trim()||j.customerName||"";
  const certifiedBy=(j.certificateUnder||"").trim()||invoiced;
  const date=formatDob(j.trainingDate);
  return {insigniaName,logoSrc,jobLabel,jobNo,courseTitle,code,invoiced,certifiedBy,date,time:""};
}

  });
  const titles={
    dashboard: isSuper()?"Super Admin dashboard": isAdmin()?"Admin dashboard":"Dashboard",
    users:"Add staff",
    jobs: isFieldUser()&&!isAdmin()?"My Assigned Jobs":(jobService+(jobService==="Training"?"":" jobs")),

    reports:"Reports"

async function refreshNoti(){
  if(!has("Training:read")) return;
  const list=await api("GET","/api/notifications").catch(()=>[]);
  window._noti=list;
  const unread=list.filter(n=>!n.read).length;
  const dot=document.getElementById("dot");
  if(dot){ dot.textContent=unread; dot.classList.toggle("hidden",unread===0); }
}
function toggleNoti(){
  const p=document.getElementById("notiPanel");
  if(p.innerHTML){ p.innerHTML=""; return; }
  const list=window._noti||[];
  p.innerHTML=`<div class="noti"><div class="h">Notifications</div>${list.length?list.map(n=>`<div class="item">${n.read?"":"🔵 "}${n.message}</div>`).join(""):`<div class="item muted">No notifications</div>`}</div>`;
  api("POST","/api/notifications/read").then(refreshNoti);
}

function certHay(j){
  const people=(j.attendees||[]).map(a=>[a.name,a.idOrVisaNo,a.company,a.mobileNumber].join(" ")).join(" ");
  const certs=(j.certificates||[]).map(c=>[c.name,c.certificateNo,c.course].join(" ")).join(" ");
  return [j.jobNo,j.jobOrderNo,j.customerName,j.course,j.assigneeName,j.trainerName,people,certs].join(" ").toLowerCase();
}

async function renderApprovals(){
  let jobs=[]; try{ jobs=await api("GET","/api/training"); }catch{}
  window._certJobs=jobs;
  const waiting=jobs.filter(j=>j.status==="Submitted");
  const issuedJobs=jobs.filter(j=>(j.certificates||[]).length);
  const issuedCount=issuedJobs.reduce((n,j)=>n+(j.certificates||[]).length,0);
  const requests=jobs.filter(j=>(j.serviceType||"Training")==="Training").flatMap(j=>(j.attendees||[]).map(a=>{
    let st="On job";
    if(j.status==="Approved") st="Issued";
    else if(j.status==="Submitted") st="Waiting for certificate";
    else if(!a.signature || !(a.photoDataUrl||a.extraPhotoDataUrl)) st="Trainee request";
    else st="Ready on job";
    return {a,j,st};
  })).filter(r=>r.st!=="Issued");
  const tab=(id,label,n)=>`<button class="${certTab===id?"on":""}" onclick="certTab='${id}';certOpenJob='';renderApprovals()">${label} (${n})</button>`;
  const openJob=jobs.find(j=>j.id===certOpenJob);
  let body="";
  if(certTab==="pending"){
    body=openJob&&waiting.some(j=>j.id===openJob.id)
      ? certJobDetailHtml(openJob,"pending")
      : `<h3>Pending</h3><p class="hint">Search, then open one job. Do not load every form at once.</p>${certJobTable(waiting,"pending")}`;
  } else if(certTab==="requests"){
    body=`<h3>Trainee requests</h3>
      <p class="hint">Search by name or job. Open the job only when you need to edit.</p>
      ${requests.length?`<div class="card">
        <input id="cert_q" value="${attr(certSearch)}" placeholder="Search name, phone, job, course" oninput="applyCertFilter()" style="max-width:420px;margin-bottom:14px">
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Company</th><th>Course</th><th>Job</th><th>Status</th><th></th></tr></thead><tbody>
        ${requests.map(({a,j,st})=>`<tr data-cert-row="${attr([a.name,a.idOrVisaNo,a.mobileNumber,a.company,a.course,j.jobNo,j.customerName].join(" ").toLowerCase())}">
          <td><b>${attr(a.name)||"-"}</b><div class="muted">${attr(a.idOrVisaNo)||"No EID"}</div></td>
          <td>${attr(a.mobileNumber)||"-"}</td>
          <td>${attr(a.company||j.customerName||"")}</td>
          <td>${attr(a.course||j.course||"")}</td>
          <td>${attr(j.jobNo)}</td>
          <td><span class="chip ${j.status==="Submitted"?"Submitted":""}">${st}</span></td>
          <td><button class="btn sm" onclick="openCertJob('${j.status==="Approved"?"issued":"pending"}','${j.id}')">Open job</button></td>
        </tr>`).join("")}
      </tbody></table></div></div>`:`<div class="card"><p class="muted">No trainee requests.</p></div>`}`;
  } else {
    body=openJob&&issuedJobs.some(j=>j.id===openJob.id)
      ? certJobDetailHtml(openJob,"issued")
      : `<h3>Issued</h3><p class="hint">When many certificates arrive, stay on this list. Search, then open one job.</p>${certJobTable(issuedJobs,"issued")}`;
  }
  document.getElementById("page").innerHTML=`
    <div class="subtabs">
      ${tab("pending","Pending",waiting.length)}
      ${tab("issued","Issued",issuedCount)}
      ${tab("requests","Trainee requests",requests.length)}
    </div>
    ${body}`;
  applyCertFilter();
}

}

async function downloadCertificatePdf(jobId,certId,certificateNo){
  try{
    const res=await fetch(`/api/training/${jobId}/certificates/${certId}/pdf?t=${Date.now()}`,{
      headers:{Authorization:"Bearer "+session.token,"Cache-Control":"no-store"}
    });
    if(!res.ok){
      const error=await res.json().catch(()=>({}));
      throw new Error(error.message||"PDF download failed");
    }
    const url=URL.createObjectURL(await res.blob());
    const a=document.createElement("a");a.href=url;a.download=certificateNo+"-certificate.pdf";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(error){alert(error.message);}
}

async function downloadCertificate(jobId,certId){
  const j=(window._certJobs||[]).find(x=>x.id===jobId);
  const c=j&&j.certificates.find(x=>x.id===certId);
  if(!j||!c) return;
  const bg=new Image();
  bg.crossOrigin="anonymous";
  bg.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=bg.naturalWidth||1240;
    canvas.height=bg.naturalHeight||1754;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(bg,0,0,canvas.width,canvas.height);
    const cx=canvas.width/2;
    let y=canvas.height*0.37;
    const maxW=canvas.width*0.68;
    const line=(text,size,bold,color,italic)=>{
      ctx.fillStyle=color||"#1e3a6e";
      ctx.font=(italic?"italic ":"")+(bold?"700 ":"400 ") + size+"px Times New Roman,serif";
      ctx.textAlign="center";
      const words=String(text).split(" ");
      let row="";
      const flush=()=>{ if(!row) return; ctx.fillText(row,cx,y); y+=size*1.35; row=""; };
      words.forEach(word=>{
        const next=row?row+" "+word:word;
        if(ctx.measureText(next).width>maxW && row){ flush(); row=word; }
        else row=next;
      });
      flush();
    };
    line("This is to certify that", Math.round(canvas.width*0.016), false, "#333", true);
    line(String(c.name).toUpperCase(), Math.round(canvas.width*0.026), true, "#111");
    if(c.idOrVisaNo) line("(EID NO: "+c.idOrVisaNo+")", Math.round(canvas.width*0.018), true, "#111");
    y+=6;
    line("Employed by", Math.round(canvas.width*0.016), false, "#333", true);
    line(String(c.company||j.certificateUnder||j.customerName).toUpperCase(), Math.round(canvas.width*0.022), true, "#111");
    y+=6;
    line("has successfully completed one day safety training for", Math.round(canvas.width*0.016), false, "#333", true);
    line(String(c.course).toUpperCase(), Math.round(canvas.width*0.022), true, "#111");
    y+=16;
    const meta=[["Certificate No.:",c.certificateNo],["Job No.:",c.jobNo||j.jobNo],["Training Date:",c.trainingDate+(j.trainingTime?"  "+j.trainingTime:""),],["Expiry Date:",c.expiresOn]];
    ctx.font=Math.round(canvas.width*0.016)+"px Times New Roman,serif";
    const labelW=Math.max(...meta.map(([k])=>ctx.measureText(k).width));
    const valW=Math.max(...meta.map(([,v])=>ctx.measureText(String(v)).width));
    const mx=cx-(labelW+18+valW)/2;
    ctx.fillStyle="#111";
    ctx.textAlign="left";
    meta.forEach(([k,v])=>{
      ctx.font=Math.round(canvas.width*0.016)+"px Times New Roman,serif";
      ctx.fillText(k,mx,y);
      ctx.fillText(String(v),mx+labelW+18,y);
      y+=canvas.height*0.02;
    });
    y+=12;
    ctx.textAlign="left";
    ctx.font=Math.round(canvas.width*0.016)+"px Times New Roman,serif";
    const ax=canvas.width*0.12, ay=canvas.height*0.66;
    ctx.fillText("Authorized by:", ax, ay);
    ctx.fillText(j.authorizedBy||j.assigneeName||j.trainerName||"", ax, ay+canvas.height*0.028);
    const finish=()=>{
      canvas.toBlob(blob=>{
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=c.certificateNo+".png";a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      },"image/png");
    };
    if(c.verificationRef){
      const qr=new Image();
      qr.onload=()=>{
        const qs=Math.round(canvas.width*0.11);
        const qx=Math.round(canvas.width*0.48);
        const qy=Math.round(canvas.height*0.54);
        ctx.fillStyle="#fff";
        ctx.fillRect(qx-6, qy-6, qs+12, qs+22);
        ctx.drawImage(qr, qx, qy, qs, qs);
        ctx.textAlign="center";
        ctx.fillStyle="#333";
        ctx.font=Math.round(canvas.width*0.01)+"px Times New Roman,serif";
        ctx.fillText("Scan to verify", qx+qs/2, qy+qs+14);
        finish();
      };
      qr.src="/verify/"+encodeURIComponent(c.verificationRef)+"/qr.png";
    } else finish();
  };
  bg.src="/certificate-bg.png";
}

  "role-front-desk":["Testing:create","Testing:read","Calibration:create","Calibration:read","Inspection:create","Inspection:read","Mapping:create","Mapping:read","Training:create","Training:read"],

function canCreateService(id){ return isSuper() || has(id+":create") || (id==="Training" && has("Training:create")); }

  if(isSuper()) return true;
  return has(id+":create")||has(id+":read")||has(id+":edit")||has("Training:read");
}
function canIssueCerts(){ return isSuper()||isAdmin()||has("Certificates:edit")||has("Certificates:read"); }
function canDownload(){ return isSuper()||isAdmin()||has("Certificates:read")||has("Training:read")||has("Training:edit"); }
function canAddTrainees(){
  return isSuper() || isTrainer() || has("Training:edit") || has("Training:add_attendees");
}
function canDeleteJob(){ return isSuper(); }
function canEditJob(){
  if(isSuper()||isAdmin()||isAssistant()) return true;
  if(isTrainer()||isSiteEngineer()) return false;
  return has("Training:edit");
}

  if(isSuper()||isTrainer()||isSiteEngineer()) return false;
  return isFrontDesk()||isAdmin()||isAssistant()||has("Training:create")||has("Training:edit");
}
function permMatrix(pre,sel){
  const addOn=sel&&(sel.includes("Training:add_attendees")||sel.includes("Training:edit"));
  const addRow=`<tr style="background:#e8f1ff"><td><b>Add trainees</b></td><td><input type="checkbox" id="${pre}_attendees" ${addOn?"checked":""} title="Allow this person to add trainee names to the trainer attendance list"></td><td></td><td></td><td></td></tr>`;
  const rows=PMODS.map(m=>{
    const cells=PACTS.map(a=>{const k=m+":"+a;const lock=a==="delete";return `<td><input type="checkbox" data-p="${k}" id="${pre}_${m}_${a}" ${sel&&sel.includes(k)?"checked":""} ${lock?"disabled title=\"Only Super Admin can delete\"":""}></td>`;}).join("");
    return `<tr><td><b>${m}</b></td>${cells}</tr>`+(m==="Training"?addRow:"");
  }).join("");
  return `<table class="perm-tbl" style="max-width:640px"><thead><tr><th>Module</th>${PACTS.map(a=>`<th>${a[0].toUpperCase()+a.slice(1)}</th>`).join("")}</tr></thead><tbody>
    ${rows}
  </tbody></table>
  <p class="hint">Tick <b>Add trainees</b> (Create column) for Sajid or Almina. Names they add show on the trainer attendance sheet. Delete stays Super Admin only.</p>`;
}
function collectPerms(pre){
  const o=[];
  PMODS.forEach(m=>PACTS.forEach(a=>{const el=document.getElementById(`${pre}_${m}_${a}`);if(el&&el.checked)o.push({module:m,action:a});}));
  const extra=document.getElementById(pre+"_attendees");
  if(extra&&extra.checked && !o.some(p=>p.module==="Training"&&p.action==="add_attendees")) o.push({module:"Training",action:"add_attendees"});
  return o;
}

function isoToday(){ return new Date().toISOString().slice(0,10); }
function jobExpiryDate(j){
  const cert=(j.certificates||[]).map(c=>c.expiresOn).filter(Boolean).sort().slice(-1)[0];
  if(cert) return cert;
  const raw=String(j.trainingDate||"").slice(0,10);
  const p=raw.split("-").map(Number);
  if(p.length!==3||!p[0]) return "";
  const d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
  d.setUTCFullYear(d.getUTCFullYear()+1);
  d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
function weekStart(iso){
  const p=String(iso).split("-").map(Number);
  const d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
  const day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()-(day-1));
  return d.toISOString().slice(0,10);
}
function addDaysIso(iso,n){
  const p=String(iso).split("-").map(Number);
  const d=new Date(Date.UTC(p[0],p[1]-1,p[2]));
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function jobInReportPeriod(j,period,ref){
  const d=String(j.trainingDate||"").slice(0,10);
  if(!d) return period==="all";
  if(period==="all") return true;
  if(period==="daily") return d===ref;
  if(period==="weekly"){
    const start=weekStart(ref);
    return d>=start && d<=addDaysIso(start,6);
  }
  if(period==="monthly") return d.slice(0,7)===ref.slice(0,7);
  if(period==="yearly") return d.slice(0,4)===ref.slice(0,4);
  return true;
}
function csvCell(v){
  const s=String(v??"");
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function openedAt(j){
  const t=j.createdAt||"";
  const s=String(t);
  if(s.length>=16) return s.slice(0,10)+" "+s.slice(11,16);
  return s.slice(0,10)||"-";
}
function applyReportFilters(){
  reportPeriod=val("rep_period")||"monthly";
  reportRefDate=val("rep_date")||isoToday();
  renderReports();
}
function downloadTrainingExcel(rows,period,ref){
  const headers=["Job No","Job Order","Customer","Course","Date from","Date to","Job time","Opened at","Location","Trainer","Status","Trainees","Certificates","Expiry date","Completed"];
  const body=rows.map(r=>[
    r.jobNo,r.jobOrderNo||"",jobCompanyNames(r).join(" · ")||r.customerName,r.course,
    r.trainingDate||"",r.trainingDateTo||r.trainingDate||"",r.trainingTime||"",openedAt(r),
    r.location||"",r.assigneeName||r.trainerName||"",r.status,
    (r.attendees||[]).length,(r.certificates||[]).length,jobExpiryDate(r),
    r.status==="Approved"?"Yes":"No"
  ].map(csvCell).join(","));
  const csv=["\ufeff"+headers.join(","),...body].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`WESTCAL-training-${period}-${ref}.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

    return true;
  });
  const rows=byStatus.filter(j=>jobInReportPeriod(j,reportPeriod,ref));
  const completed=rows.filter(j=>j.status==="Approved");
  const customers=[...new Set(rows.flatMap(j=>jobCompanyNames(j)).filter(Boolean))];

  document.getElementById("page").innerHTML=`

        <div><label>Period</label><select id="rep_period" onchange="applyReportFilters()">

          <option value="weekly" ${reportPeriod==="weekly"?"selected":""}>Weekly</option>
          <option value="monthly" ${reportPeriod==="monthly"?"selected":""}>Monthly</option>
          <option value="yearly" ${reportPeriod==="yearly"?"selected":""}>Yearly</option>
          <option value="all" ${reportPeriod==="all"?"selected":""}>All dates</option>
        </select></div>
      </div>
      <div class="kpis">

        <div class="kpi"><span>Completed</span><b>${completed.length}</b></div>

        <div class="kpi"><span>Customers</span><b>${customers.length}</b></div>
        <div class="kpi"><span>Expiring in 30 days</span><b>${expiring.length}</b></div>
      </div>
      <p><button class="btn dark" ${rows.length?"":"disabled"} onclick='downloadTrainingExcel(window._reportRows,reportPeriod,reportRefDate)'>Download Excel</button>
      ${canIssueCerts()?`<button class="btn sec" onclick="goToCertificates(reportStatus==='issued'?'issued':'pending')">Open certificates</button>`:""}</p>
      ${rows.length?`<div class="table-wrap"><table><thead><tr>
        <th>Job No</th><th>Customer</th><th>Course</th><th>Date</th><th>Time</th><th>Status</th><th>Trainees</th><th>Certs</th><th>Expiry</th>
      </tr></thead><tbody>
        ${rows.map(j=>`<tr>
          <td><b>${j.jobNo}</b></td>
          <td>${jobCompanyNames(j).join(" · ")||j.customerName||"-"}</td>
          <td>${j.course||"-"}</td>
          <td>${jobDateRange(j)}</td>

      </tbody></table></div>`:`<p class="muted">Nothing in this report.</p>`}
      ${reportStatus!=="pending"&&issuedRows.length?`<h3 style="margin-top:22px">Certificates in this period (${issuedRows.length})</h3>

function chooseLayout(prefix, input){
  const file=input.files&&input.files[0];
  if(!file) return;
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{
    const maxW=1400;
    const scale=img.naturalWidth>maxW?maxW/img.naturalWidth:1;
    const canvas=document.createElement("canvas");
    canvas.width=Math.max(1, Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1, Math.round(img.naturalHeight*scale));
    canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
    URL.revokeObjectURL(url);
    const data=canvas.toDataURL("image/png");
    const hidden=document.getElementById(prefix+"_layout");
    if(hidden){ hidden.value=data; hidden.dataset.touched="1"; }
    const preview=document.getElementById(prefix+"_layout_preview");
    if(preview){ preview.src=data; preview.style.display="block"; }
  };
  img.onerror=()=>{ URL.revokeObjectURL(url); alert("Could not read that picture. Use a PNG or JPG."); };
  img.src=url;
}
function clearLayout(prefix){
  const hidden=document.getElementById(prefix+"_layout");
  if(hidden){ hidden.value=""; hidden.dataset.touched="1"; }
  const preview=document.getElementById(prefix+"_layout_preview");
  if(preview){ preview.removeAttribute("src"); preview.style.display="none"; }
  const file=document.getElementById(prefix+"_layout_file");
  if(file) file.value="";
}

function splitTempRange(range){

  const a=Number(nums[0]), b=Number(nums[1]);
  const unit=/%/.test(range||"")?"%":"°C";
  return {min:a+unit, max:b+unit, mid:((a+b)/2)+unit};
}

function applyCourseToDescription(){
  if(jobService!=="Training") return;
  const names=selectedCourses();
  const picks=document.getElementById("j_course_picks");
  if(picks) picks.innerHTML=names.length
    ? names.map(n=>`<span class="chip">${n}</span>`).join("")
    : `<span class="muted">No course selected yet.</span>`;
  const desc=names.map(courseDescription).join("\n");
  const box=document.getElementById("j_desc");
  if(box && (!box.value || box.dataset.fromCourse==="1")){
    box.value=desc;
    box.dataset.fromCourse="1";
  }
  const tb=document.querySelector("#liTable tbody");
  if(!tb) return;
  const keep=[...tb.querySelectorAll("tr")].filter(tr=>{
    const input=tr.querySelector(".li-desc");
    return input && input.value && input.dataset.fromCourse!=="1";
  });
  tb.innerHTML="";
  names.forEach(name=>{
    addLine();
    const tr=tb.lastElementChild;
    const input=tr.querySelector(".li-desc");
    input.value=courseDescription(name);
    input.dataset.fromCourse="1";
    const qty=tr.querySelector(".li-qty");
    if(qty && !qty.value) qty.value="1";
  });
  keep.forEach(tr=>tb.appendChild(tr));
  [...tb.children].forEach((tr,i)=>{ tr.cells[0].textContent=String(i+1); });
}
function collectLines(){return [...document.querySelectorAll("#liTable tbody tr")].map((tr,i)=>({sn:i+1,description:tr.querySelector(".li-desc").value,qty:tr.querySelector(".li-qty").value,remarks:tr.querySelector(".li-rem").value})).filter(l=>l.description);}

    ${j.assigneeName||j.trainerName?`<p style="margin-top:12px"><b>Assigned to:</b> ${j.assigneeName||j.trainerName}${j.assigneeRole?` <span class="chip">${j.assigneeRole}</span>`:""}</p>`:""}
    ${(j.serviceType||"")==="Mapping"?mappingProtocolEditor(j):""}`;
  if(j.status==="Cancelled") h+=`<div class="card" style="border-color:#f0c9c9;background:#fff8f8"><h3 style="color:var(--warn)">Cancelled</h3><p>By ${attr(j.cancelledBy||"office")}${j.cancelledAt?" · "+new Date(j.cancelledAt).toLocaleString():""}</p><p><b>Reason:</b> ${attr(j.cancelledReason||"-")}</p></div>`;
  if(canCancelJob()&&j.status!=="Approved"&&j.status!=="Cancelled") h+=`<p><button class="btn warn" onclick="cancelJobRow('${j.id}','${j.jobNo}')">Cancel this job</button></p>`;

  if(canAssign&&(j.status==="Created"||j.status==="Assigned"||j.status==="Rejected"))
    h+=`<div class="sect">Assign to trainer / site engineer</div><div style="display:flex;gap:10px;max-width:460px"><select id="asg">${assignees.map(t=>`<option value="${t.id}">${t.displayName} — ${t.roleName}</option>`).join("")||`<option value="">(no trainers or site engineers)</option>`}</select><button class="btn" onclick="assign('${j.id}')">Assign &amp; notify</button></div>`;

  if(!training&&isFieldUser()&&(j.status==="Assigned"||j.status==="In Progress")&&j.lineItems)
    h+=`<div class="sect">Record test results</div>`+j.lineItems.map(l=>{
      const r=resultFor(l.sn)||{};
      return `<div class="grid" style="margin-bottom:12px;padding:12px;border:1px solid var(--line);border-radius:10px">
        <div style="grid-column:1/-1"><b>${l.sn}. ${l.description}</b></div>
        <div><label>Reading</label><input id="rd_${l.sn}" value="${r.reading||""}"></div>
        <div><label>Result</label><select id="rs_${l.sn}"><option ${r.result==="Pass"?"selected":""}>Pass</option><option ${r.result==="Fail"?"selected":""}>Fail</option></select></div>
        <div><label>Remarks</label><input id="rm_${l.sn}" value="${r.remarks||""}"></div>
        <div style="align-self:end"><button class="btn sm" onclick="saveResult('${j.id}',${l.sn})">Save result</button></div>
      </div>`;
    }).join("");

  if(training&&isFieldUser()&&(j.status==="Assigned"||j.status==="In Progress"))
    h+=`<div class="sect">Upload trainee Emirates ID (auto-fetch)</div>
      <p class="hint">Paste ID text (simulating a scan/OCR). Details auto-fill — correct if needed.</p>
      <textarea id="ocr" rows="4" placeholder="Name: HAROON UR RASHEED\nID Number: 784-1990-1234567-1\nNationality: Pakistan\n+971 56 665 4326"></textarea>
      <button class="btn sec" style="margin-top:8px" onclick="fetchId('${j.id}')">Auto-fetch from ID</button><div id="attForm"></div>`;

  if(training){
    const s=sheetView(j);
    const courses=String(j.course||"").split(" · ").map(x=>x.trim()).filter(Boolean);
    const office=canIssueCerts()||isSuper()||canEditJob();
    const addNames=canAddTrainees()&&j.status!=="Cancelled";
    h+=`<div class="sect">Trainees (${j.attendees.length})</div>
      <p class="hint">${s.courseTitle} · ${s.date}${j.trainingTime?" · "+j.trainingTime:""} · ${s.certifiedBy}</p>
      ${addNames?`<div class="job-block" style="margin-bottom:14px">
        <h4>Add a trainee</h4>
        <p class="hint">This name is added to the trainer attendance list on /m.</p>
        <div class="grid">
          <div><label>Name</label><input id="list_name"></div>
          <div><label>Emirates ID</label><input id="list_eid" placeholder="784-1990-1234567-1"></div>
          <div><label>Phone</label><input id="list_phone"></div>
          <div><label>Company</label>${companyFieldHtml(j,"list_company",j.customerName||"")}</div>
          <div><label>Course</label>${courses.length>1
            ? `<select id="list_course">${courses.map(c=>`<option>${c}</option>`).join("")}</select>`
            : `<input id="list_course" value="${j.course||""}" readonly>`}</div>
        </div>
        <button class="btn sec sm" style="margin-top:8px" onclick="addTraineeToOfficeList('${j.id}')">Add trainee</button>
        <div class="err" id="list_err"></div>
      </div>`:""}
      ${j.attendees.length?j.attendees.map((a,i)=>`<div class="job-block">
        <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
          ${(a.photoDataUrl||a.extraPhotoDataUrl)?`<img src="${a.photoDataUrl||a.extraPhotoDataUrl}" alt="" style="height:72px;width:58px;object-fit:cover;border-radius:8px">`:""}
          <div style="flex:1;min-width:240px">
            <b>${i+1}. ${a.name||"Trainee"}</b>
            ${a.signature?` · signed`:""}
            ${office?`<div class="grid" style="margin-top:10px">
              <div><label>Name</label><input id="ed_name_${a.id}" value="${(a.name||"").replace(/"/g,"&quot;")}"></div>
              <div><label>Emirates ID</label><input id="ed_eid_${a.id}" value="${(a.idOrVisaNo||"").replace(/"/g,"&quot;")}"></div>
              <div><label>Phone</label><input id="ed_phone_${a.id}" value="${a.mobileNumber||""}"></div>
              <div><label>Company</label><input id="ed_co_${a.id}" value="${(a.company||"").replace(/"/g,"&quot;")}"></div>
              <div class="span-2"><label>Course</label><select id="ed_course_${a.id}">${(courses.length?courses:[a.course||j.course||""]).map(c=>`<option ${c===(a.course||j.course)?"selected":""}>${c}</option>`).join("")}</select></div>
            </div>
            <p style="margin:10px 0 0">
              <button class="btn sec sm" onclick="saveTraineeAdmin('${j.id}','${a.id}')">Save trainee</button>
              ${j.traineeInviteToken&&a.editToken?`<button class="btn ghost sm" onclick="copyTraineeJoin('${j.traineeInviteToken}','${a.editToken}')">Copy join link</button>`:""}
            </p>`:`<p class="muted" style="margin:6px 0 0">EID: ${a.idOrVisaNo||"-"} · ${a.company||j.customerName} · ${a.course||j.course||""}</p>`}
          </div>
        </div>
      </div>`).join(""):`<p class="muted">No trainees yet.</p>`}
    ${canDownload()?`<p style="margin-top:12px">
      <button class="btn dark sm" onclick="downloadJobSheetPdf('${j.id}','${j.jobOrderNo||j.jobNo}')">Job sheet</button>
      ${(j.serviceType||"")==="Mapping"?`<button class="btn sm" onclick="downloadMappingProtocol('${j.id}')">Protocol report</button>`:""}
      <button class="btn dark sm" onclick="downloadAttendancePdf('${j.id}','${j.jobOrderNo||j.jobNo}')">Attendance</button>
      ${["Submitted","Approved"].includes(j.status)?`
      <button class="btn dark sm" onclick="downloadWorkPermitPdf('${j.id}','${j.jobOrderNo||j.jobNo}')">Work permit</button>
      <button class="btn dark sm" onclick="downloadReviewPdf('${j.id}','${j.jobOrderNo||j.jobNo}')">Review form</button>`:""}
    </p>`:""}`;
  }

  if(canIssueCerts()&&["Submitted","Approved"].includes(j.status)){
    const review=j.contractReview||{};
    h+=`<details style="margin:16px 0"><summary class="muted" style="cursor:pointer">Supporting files and trainer review</summary>
      <div style="padding:12px 0">
        <p class="hint">Feedback: ${review.customerFeedback||"Not recorded"} · ${review.customerFeedbackNotes||"-"}</p>
        ${(j.attachments||[]).length?(j.attachments||[]).map(a=>`<a class="btn ghost sm" style="margin:0 6px 6px 0" href="${a.dataUrl}" download="${a.fileName}">${a.type}: ${a.fileName}</a>`).join(""):`<span class="muted">No uploaded files</span>`}
      </div>
    </details>`;
  }

  if(isFieldUser()&&j.status==="In Progress"&&(training?j.attendees.length>0:allRecorded))
    h+=`<button class="btn ok" style="margin-top:14px" onclick="submitJob('${j.id}')">Submit to admin for certificates</button>`;
  if(canEditJob()&&["Submitted","Assigned","In Progress","Rejected","Approved"].includes(j.status)&&j.status!=="Cancelled"){
    h+=`<div class="sect">${j.status==="Approved"?"Correct job after certificates":"Office — edit dates"}</div>
      <p class="hint">${j.status==="Approved"?"Changing the date or certified-to name also updates every issued certificate. Download the PDF again after you save.":"Change dates, job time and the certificate name without sending the job back to the trainer."}</p>
      <div class="grid">
        <div><label>Date from</label><input id="of_date" type="date" value="${j.trainingDate||""}"></div>
        <div><label>Date to</label><input id="of_date_to" type="date" value="${j.trainingDateTo||j.trainingDate||""}"></div>
        <div><label>Job time</label><input id="of_time" type="time" value="${j.trainingTime||""}"></div>
        <div><label>Certified to (prints on certificate)</label><input id="of_certified" value="${(j.certificateUnder||j.customerName||"").replace(/"/g,"&quot;")}"></div>
      </div>
      <button class="btn sec sm" style="margin-top:10px" onclick="saveOfficeJobData('${j.id}')">Save dates &amp; certified to</button>
      <div class="err" id="ofe"></div>`;
  }

  if(canIssueCerts()&&j.status==="Submitted")
    h+=`<p style="margin-top:16px"><button class="btn ok" onclick="goToCertificates('pending')">Certificates — pending</button></p>`;
  if(j.status==="Rejected"&&j.rejectedReason) h+=`<p class="err">Returned: ${j.rejectedReason}</p>`;

  if(j.certificates.length){
    h+=`<div class="sect">Certificates</div>
      ${j.certificates.map(c=>`<p style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <b>${attr(c.certificateNo)}</b>
        <span class="muted">${attr(c.name)}</span>
        <button class="btn dark sm" onclick="downloadCertificatePdf('${j.id}','${c.id}','${String(c.certificateNo||"").replace(/'/g,"")}')">Download</button>
      </p>`).join("")}
      <p style="margin-top:8px"><button class="btn sec sm" onclick="goToCertificates('issued')">Open certificate page</button></p>`;
  }
  h+=`</div>`; el.innerHTML=h;
  if((j.serviceType||"")==="Mapping"){ setTempRange("p", j.mappingRange||""); setHumRange("p", j.maxHumRange||""); setSeasonYear("p", j.seasonYear||""); renderLoggerRows("p", j.loggerLocations); }
  el.scrollIntoView({behavior:"smooth"});
}
async function saveResult(id,sn){
  try{
    await api("POST",`/api/training/${id}/results`,{sn,reading:document.getElementById("rd_"+sn).value,result:document.getElementById("rs_"+sn).value,remarks:document.getElementById("rm_"+sn).value});
    openJob(id);
  }catch(err){ alert(err.message); }
}
async function assign(id){await api("POST",`/api/training/${id}/assign`,{assigneeId:document.getElementById("asg").value});go("jobs");}
async function fetchId(id){const f=await api("POST",`/api/training/${id}/id-fetch`,{ocrText:document.getElementById("ocr").value});
  document.getElementById("attForm").innerHTML=`<p class="ok-msg">Auto-fetched (${(f.confidence*100).toFixed(0)}% confidence). Review &amp; correct:</p>
    <div class="grid"><div><label>Name</label><input id="a_name" value="${f.name||''}"></div><div><label>Company</label><input id="a_company"></div>
    <div><label>Emirates ID / Visa</label><input id="a_id" value="${f.idOrVisaNo||''}"></div><div><label>Nationality</label><input id="a_nat" value="${f.nationality||''}"></div>
    <div><label>Mobile (7-20 digits)</label><input id="a_mob" value="${f.mobileNumber||''}"></div></div>
    <button class="btn" style="margin-top:12px" onclick="addAttendee('${id}')">Add trainee</button><div class="err" id="ae"></div>`;}
async function addAttendee(id){const e=document.getElementById("ae");e.textContent="";
  try{await api("POST",`/api/training/${id}/attendees`,{name:a_name.value,company:a_company.value,idOrVisaNo:a_id.value,nationality:a_nat.value,mobileNumber:a_mob.value,autoFetched:true,idCardFileName:"emirates-id.jpg"});openJob(id);}catch(err){e.textContent=err.message;}}
async function submitJob(id){await api("POST",`/api/training/${id}/submit`);openJob(id);refreshNoti();}
async function approve(id){
  const picked=document.querySelector("input[name=cert_design]:checked");
  await api("POST",`/api/training/${id}/approve`,{design:picked?picked.value:"achievement"});
  openJob(id);
}
async function saveOfficeJobData(id){
  const e=document.getElementById("ofe"); if(e) e.textContent="";
  try{
    await api("PATCH",`/api/training/${id}`,{
      trainingDate:val("of_date"), trainingDateTo:val("of_date_to"),
      trainingTime:val("of_time"), certificateUnder:val("of_certified")
    });
    openJob(id);
  }catch(err){ if(e) e.textContent=err.message; }
}
async function reject(id){
  const r=prompt("Reason to return this job?");
  if(r==null) return;
  await api("POST",`/api/training/${id}/reject`,{reason:r||""});
  closeJobModal();
  if(view==="approvals") renderApprovals();
  else openJob(id);
}

try { renderSignIn(); } catch (err) {
  document.getElementById("root").innerHTML = "<div class='signin-page'><div class='signin'><h1>Page error</h1><p class='err'>"+String(err&&err.message||err)+"</p><p class='muted'>Open Chrome to http://127.0.0.1:3000 while npm start is running.</p></div></div>";
}
</script>
</body>
</html>
