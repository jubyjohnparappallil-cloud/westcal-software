<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Westcal training — trainee sign-in</title>
<link rel="icon" type="image/jpeg" href="/logo.jpg" />
<style>
  body{margin:0;background:#eef2f7;font:16px/1.5 Arial,Helvetica,sans-serif;color:#12203a}
  .page{max-width:640px;margin:16px auto;background:#fff;border:1px solid #d5dde8;border-radius:12px;overflow:hidden}
  .wc-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}
  .wc-ct{font:bold 12px/1.45 Times New Roman,Times,serif}
  .wc-top img{height:48px}
  .wc-bar{background:#4d83bc;color:#fff;text-align:center;font:700 12px Arial;padding:8px}
  .inner{padding:16px 18px 24px}
  label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
  input,select{width:100%;padding:10px;border:1px solid #c5d0de;border-radius:8px;font:16px Arial;box-sizing:border-box}
  .btn{display:block;width:100%;margin-top:10px;background:#0b4f9c;color:#fff;border:0;padding:12px;border-radius:10px;font:700 15px Arial}
  .btn.sec{background:#fff;color:#0b4f9c;border:1px solid #0b4f9c}
  .signpane{border:1px solid #c5d0de;border-radius:12px;background:#fff;padding:12px;margin-top:14px}
  canvas.sig{width:100%;height:240px;border:1px dashed #8aa0bc;background:#fafafa;border-radius:8px;touch-action:none;-webkit-user-select:none;user-select:none}
  .err{color:#c62828;font-weight:700;margin-top:8px}
  .ok{color:#0f8a4a;font-weight:700}
  .muted{color:#5d6b82;font-size:13px}
</style>
</head>
<body>
<div class="page">
  <div class="wc-top">
    <div class="wc-ct">T: +9714 576 2773<br>M: +971 56 665 4326<br>E: training@westcal.ae<br>W: www.westcal.ae</div>
    <img src="/logo.jpg" alt="WESTCAL">
  </div>
  <div class="wc-bar">WESTCAL INSTRUMENTATION AND CALIBRATION SERVICES LLC</div>
  <div class="inner" id="app"><p class="muted">Loading…</p></div>
</div>
<script>
const parts=location.pathname.split("/").filter(Boolean);
const token=parts[1];
const editToken=parts[2]||"";
let info=null, slot=null, signature=null;
const $=id=>document.getElementById(id);
async function api(method,path,body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.message||"Request failed");
  return d;
}
function bindSig(){
  const cv=$("sig"); if(!cv) return;
  const ctx=cv.getContext("2d");
  let drawing=false;
  function size(){
    const dpr=window.devicePixelRatio||1;
    const r=cv.getBoundingClientRect();
    ctx.setTransform(1,0,0,1,0,0);
    cv.width=Math.max(1,Math.round(r.width*dpr));
    cv.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.6; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#12203a";
    signature=null;
  }
  size();
  window.addEventListener("resize", size);
  const pt=e=>{
    const t=e.touches&&e.touches[0];
    const x=t?t.clientX:e.clientX, y=t?t.clientY:e.clientY;
    const b=cv.getBoundingClientRect();
    return {x:x-b.left,y:y-b.top};
  };
  function start(e){ e.preventDefault(); drawing=true; const p=pt(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); }
  function move(e){ if(!drawing)return; e.preventDefault(); const p=pt(e); ctx.lineTo(p.x,p.y); ctx.stroke(); }
  function end(e){ if(!drawing)return; if(e) e.preventDefault(); drawing=false; signature=cv.toDataURL("image/png"); }
  cv.addEventListener("pointerdown", e=>{ start(e); try{cv.setPointerCapture(e.pointerId)}catch(x){} });
  cv.addEventListener("pointermove", move);
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);
  cv.addEventListener("touchstart", start, {passive:false});
  cv.addEventListener("touchmove", move, {passive:false});
  cv.addEventListener("touchend", end, {passive:false});
  $("clr").onclick=()=>size();
}
async function load(){
  try{
    info=await api("GET","/api/public/join/"+token);
    if(editToken) slot=await api("GET","/api/public/join/"+token+"/slot/"+editToken);
    if(!info.open){ $("app").innerHTML="<p>"+(info.closedReason||"This link is closed.")+"</p>"; return; }
    const courses=info.courses||[info.course].filter(Boolean);
    const companies=info.companies||[info.customerName].filter(Boolean);
    $("app").innerHTML=`
      <h2 style="margin:0 0 6px">Trainee sign-in</h2>
      <p class="muted">${info.course||""} · ${info.trainingDate||""} · ${info.customerName||""}</p>
      <p class="muted">Check your details, sign with your finger, then send.</p>
      <label>Full name *</label><input id="a_name" value="${slot?slot.name:""}">
      <label>Emirates ID / Visa no</label><input id="a_id" value="${slot?slot.idOrVisaNo:""}">
      <label>Date of birth</label><input id="a_dob" type="date">
      <label>Nationality</label><input id="a_nat">
      <label>Phone number *</label><input id="a_mob" value="${slot?slot.mobileNumber:""}" inputmode="tel">
      <label>Your company *</label>
      ${companies.length>1?`<select id="a_company">${companies.map(c=>`<option ${slot&&slot.company===c?"selected":""}>${c}</option>`).join("")}</select>`:`<input id="a_company" value="${slot&&slot.company||companies[0]||""}">`}
      <label>Training course *</label>
      ${courses.length>1?courses.map(c=>`<label class="muted" style="font-weight:600"><input type="checkbox" name="course" value="${c}" style="width:auto" ${(slot?slot.course===c:true)?"checked":""}> ${c}</label>`).join(""):`<input type="hidden" id="a_course" value="${courses[0]||""}">`}
      <div class="signpane">
        <p class="muted" style="margin:0 0 8px"><b>Sign here</b> — draw with your finger</p>
        <canvas class="sig" id="sig"></canvas>
        <button class="btn sec" type="button" id="clr">Clear signature</button>
        <button class="btn" type="button" id="send">Send</button>
        <div class="err" id="ae"></div>
      </div>`;
    bindSig();
    $("send").onclick=send;
  }catch(err){ $("app").innerHTML="<p class='err'>"+err.message+"</p>"; }
}
async function send(){
  $("ae").textContent="";
  const mob=($("a_mob").value||"").replace(/[\s-+]/g,"");
  if(!$("a_name").value.trim()){ $("ae").textContent="Name is required."; return; }
  if(!/^\d{7,20}$/.test(mob)){ $("ae").textContent="Phone number must be 7 to 20 digits."; return; }
  if(!signature){ $("ae").textContent="Please sign."; return; }
  const boxes=[...document.querySelectorAll("input[name=course]:checked")].map(el=>el.value);
  const course=$("a_course")?$("a_course").value:"";
  const courses=boxes.length?boxes:(course?[course]:[]);
  const payload={
    name:$("a_name").value, company:$("a_company").value, idOrVisaNo:$("a_id").value,
    nationality:$("a_nat").value, mobileNumber:mob, dateOfBirth:$("a_dob").value||undefined,
    signature, courses, course:courses[0]
  };
  try{
    if(editToken && slot){
      await api("PATCH","/api/public/join/"+token+"/attendees/"+editToken,payload);
    }else{
      await api("POST","/api/public/join/"+token+"/attendees",payload);
    }
    $("app").innerHTML="<p class='ok'>Sent. Your name is on the attendance sheet.</p>";
  }catch(err){ $("ae").textContent=err.message; }
}
load();
</script>
</body>
</html>
